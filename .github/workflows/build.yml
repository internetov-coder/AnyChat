name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter gen-l10n
        run: flutter gen-l10n

      - name: build_runner (bootstrap drift schema)
        # `lib/core/storage/db.dart` uses `part 'db.g.dart'`, but the riverpod
        # generator must not run before that part exists (it would see the
        # generated row types as unresolved). Generate just the drift output
        # first, then run the full build.
        run: dart run build_runner build --build-filter=lib/core/storage/db.g.dart

      - name: verify drift output exists
        run: test -s lib/core/storage/db.g.dart

      - name: build_runner (full)
        run: dart run build_runner build

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Short SHA
        id: sha
        shell: bash
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnyChat-${{ steps.sha.outputs.value }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        # Every green push to main gets a release with tag rN (N = max of the
        # existing rN tags + 1) and an APK asset named AnyChat-arm64-rN.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[].tag_name | select(test("^r[0-9]+$")) | ltrimstr("r") | tonumber] | max // 0')
          echo "latest release number: ${base}"
          for i in $(seq 0 19); do
            n=$((base + i + 1))
            if gh release view "r${n}" > /dev/null 2>&1; then
              continue
            fi
            sha7="${GITHUB_SHA:0:7}"
            asset="AnyChat-arm64-r${n}.apk"
            cp "build/app/outputs/flutter-apk/app-release.apk" "${asset}"
            gh release create "r${n}" "${asset}" \
              --target "${GITHUB_SHA}" \
              --title "AnyChat r${n}" \
              --notes "Automated release build \`${sha7}\` — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --latest
            echo "published release r${n} with asset ${asset}"
            exit 0
          done
          echo "Could not allocate a free release tag" >&2
          exit 1
